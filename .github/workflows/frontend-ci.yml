name: CI — 前端构建与部署

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

jobs:
  build:
    name: 构建并提交dist
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build
        working-directory: ./frontend
        run: |
          set +e
          npm run build 2>&1 | tee build.log
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            # Print errors as GitHub annotations
            echo ""
            echo "::error::Vite build failed with exit code $EXIT_CODE"
            echo "::error::Last 15 lines of build output:"
            tail -15 build.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            # Also print first 10 error lines
            grep -i "error" build.log | head -10 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi
        env:
          VITE_API_BASE: /api

      - name: Commit and push dist
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/dist/
          git diff --cached --quiet || (git commit -m "chore: auto-build dist" && git push)
