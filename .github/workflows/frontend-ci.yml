name: CI — 前端构建与部署

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

jobs:
  build:
    name: 构建并提交dist
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build
        working-directory: ./frontend
        id: vite-build
        run: |
          npm run build 2>&1 | tee build-output.log
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "BUILD_FAILED=true" >> $GITHUB_OUTPUT
            echo "BUILD_EXIT=$BUILD_EXIT" >> $GITHUB_OUTPUT
          fi
          exit $BUILD_EXIT
        env:
          VITE_API_BASE: /api
        continue-on-error: true

      - name: Debug Build Error
        if: steps.vite-build.outputs.BUILD_FAILED == 'true'
        working-directory: ./frontend
        run: |
          echo "========== BUILD ERROR DETAILS =========="
          echo "Exit code: ${{ steps.vite-build.outputs.BUILD_EXIT }}"
          echo ""
          echo "=== Last 100 lines of build output ==="
          tail -100 build-output.log
          echo ""
          echo "========================================"
          exit 1

      - name: Commit and push dist
        if: steps.vite-build.outputs.BUILD_FAILED != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/dist/
          git diff --cached --quiet || (git commit -m "chore: auto-build dist" && git push)
