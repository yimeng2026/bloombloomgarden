name: CI/CD — 千界花园无界面服务构建与部署

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-test:
    name: Express 编排后端构建
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Kimi cluster unit tests
        run: npm run test:unit
      - name: Build without suppressing TypeScript failures
        run: npm run build

  research-platform-test:
    name: Kimi 研究 API 测试与构建
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Check generated catalog and run unit regressions
        run: bun run test
      - name: Type check
        run: bunx tsc --noEmit
      - name: Lint Kimi control core (legacy lint:all remains separate)
        run: bun run lint
      - name: Build standalone API application
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Verify standalone entrypoint
        run: test -f .next/standalone/server.js

  docker:
    name: Docker 镜像
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend-test, research-platform-test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/thousand-realms-garden:latest
            ${{ secrets.DOCKER_USERNAME }}/thousand-realms-garden:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-render:
    name: 部署研究 API 到 Render
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: docker
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render Deploy
        run: curl --fail-with-body -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" -H "Content-Type: application/json"
