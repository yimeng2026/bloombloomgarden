version: '3.8'

services:
  # ─── 千界花园后端 ──────────────────────────────────
  garden-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thousand-realms-garden
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=file:/app/data/dev.db
    volumes:
      - garden-data:/app/data
      - ./backend/src/config:/app/dist/config:ro
    networks:
      - garden-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r)=>process.exit(r.statusCode===200?0:1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── Prisma Studio（可选，数据库可视化） ───────────
  prisma-studio:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: garden-prisma-studio
    command: npx prisma studio --port 5555
    ports:
      - "5555:5555"
    environment:
      - DATABASE_URL=file:/app/data/dev.db
    volumes:
      - garden-data:/app/data
    networks:
      - garden-network
    depends_on:
      - garden-backend
    restart: unless-stopped

  # ─── Redis（可选，SSE/消息总线扩展） ────────────────
  redis:
    image: redis:7-alpine
    container_name: garden-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - garden-network
    restart: unless-stopped

  # ─── Nginx（可选，反向代理 + 静态文件） ────────────
  nginx:
    image: nginx:alpine
    container_name: garden-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - garden-network
    depends_on:
      - garden-backend
    restart: unless-stopped

volumes:
  garden-data:
    driver: local
  redis-data:
    driver: local

networks:
  garden-network:
    driver: bridge
