openapi: 3.0.3
info:
  title: 千界花园 (Thousand Realms Garden) API
  description: '群智协同操作系统 REST API — XYZ 三轴自由连接、多 Agent 编排、统一 LLM 适配


    📊 自动扩展: 145 个新端点已从后端路由同步'
  version: 1.0.0
  contact:
    name: Thousand Realms Garden Team
  license:
    name: MIT
servers:
- url: http://localhost:3001/api
  description: 本地开发环境
- url: https://thousand-realms-garden.onrender.com/api
  description: 生产环境 (Render)
tags:
- name: Auth
  description: 用户认证与授权
- name: Agents
  description: Agent 生命周期管理
- name: Dialog
  description: 对话与消息
- name: Groups
  description: 群组编排（sequential/parallel/hierarchical）
- name: Tasks
  description: 任务调度与执行
- name: Knowledge
  description: 知识库与 RAG
- name: API Keys
  description: LLM Provider API 密钥管理
- name: Monitoring
  description: 系统监控与用量统计
- name: System
  description: 系统健康与配置
paths:
  /auth/register:
    post:
      tags:
      - Auth
      summary: 用户注册
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - username
              - email
              - password
              properties:
                username:
                  type: string
                  minLength: 3
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
      responses:
        201:
          description: 注册成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                          username:
                            type: string
                          email:
                            type: string
                          role:
                            type: string
        400:
          description: 参数错误或用户已存在
  /auth/login:
    post:
      tags:
      - Auth
      summary: 用户登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - username
              - password
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        200:
          description: 登录成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      user:
                        $ref: '#/components/schemas/User'
        401:
          description: 认证失败
  /auth/me:
    get:
      tags:
      - Auth
      summary: 获取当前用户信息
      security:
      - BearerAuth: []
      responses:
        200:
          description: 当前用户信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/User'
  /agents:
    get:
      tags:
      - Agents
      summary: 获取 Agent 列表
      security:
      - BearerAuth: []
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - idle
          - running
          - error
          - offline
      - name: workspaceId
        in: query
        schema:
          type: string
      responses:
        200:
          description: Agent 列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Agent'
    post:
      tags:
      - Agents
      summary: 创建 Agent
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentInput'
      responses:
        201:
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Agent'
  /agents/{id}:
    get:
      tags:
      - Agents
      summary: 获取单个 Agent
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        200:
          description: Agent 详情
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Agent'
    put:
      tags:
      - Agents
      summary: 更新 Agent
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentInput'
      responses:
        200:
          description: 更新成功
    delete:
      tags:
      - Agents
      summary: 删除 Agent
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        204:
          description: 删除成功
  /agents/{id}/chat:
    post:
      tags:
      - Agents
      - Dialog
      summary: 与 Agent 对话
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - message
              properties:
                message:
                  type: string
                  description: 用户消息
                stream:
                  type: boolean
                  default: false
                model:
                  type: string
                  description: 指定模型，不指定则用默认
      responses:
        200:
          description: 对话响应
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      response:
                        type: string
                      reasoning_content:
                        type: string
                      model:
                        type: string
                      tokens:
                        type: object
                        properties:
                          prompt:
                            type: integer
                          completion:
                            type: integer
                          total:
                            type: integer
        202:
          description: SSE 流式响应开始
  /agents/{id}/context:
    get:
      tags:
      - Agents
      summary: 获取 Agent 上下文
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        200:
          description: Agent 完整上下文
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      systemPrompt:
                        type: string
                      historyMessages:
                        type: array
                        items:
                          $ref: '#/components/schemas/ChatMessage'
                      toolCalls:
                        type: array
                        items:
                          $ref: '#/components/schemas/ToolCall'
                      knowledgeRefs:
                        type: array
                        items:
                          $ref: '#/components/schemas/KnowledgeRef'
                      tokenUsage:
                        type: object
                        properties:
                          prompt_tokens:
                            type: integer
                          completion_tokens:
                            type: integer
                          total_tokens:
                            type: integer
                          cost_usd:
                            type: number
                          model:
                            type: string
  /agents/{id}/context/stream:
    get:
      tags:
      - Agents
      summary: SSE 实时推送 Agent 上下文变更
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        200:
          description: SSE 事件流
          content:
            text/event-stream:
              schema:
                type: string
                example: 'event: context-update

                  data: {"type": "message", "content": "..."}

                  '
  /apikeys:
    get:
      tags:
      - API Keys
      summary: 列出已保存的 API Key（脱敏）
      security:
      - BearerAuth: []
      responses:
        200:
          description: API Key 列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/APIKey'
    post:
      tags:
      - API Keys
      summary: 保存新 API Key
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - provider
              - apiKey
              properties:
                provider:
                  type: string
                  enum:
                  - openai
                  - azure
                  - anthropic
                  - deepseek
                  - moonshot
                  - kimi-code
                  - qwen
                  - gemini
                  - glm
                  - openrouter
                apiKey:
                  type: string
                  description: 原始 API Key（AES-256-GCM 加密存储）
                isActive:
                  type: boolean
                  default: true
      responses:
        201:
          description: 保存成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/APIKey'
  /apikeys/{id}:
    delete:
      tags:
      - API Keys
      summary: 删除 API Key
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        204:
          description: 删除成功
  /apikeys/{id}/toggle:
    patch:
      tags:
      - API Keys
      summary: 切换 API Key 激活状态
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        200:
          description: 状态已更新
  /apikeys/{id}/test:
    post:
      tags:
      - API Keys
      summary: 测试单个 API Key 连通性
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        200:
          description: 测试结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      valid:
                        type: boolean
                      latency:
                        type: number
                        description: 响应延迟(ms)
                      model:
                        type: string
                      error:
                        type: string
  /apikeys/test-all:
    post:
      tags:
      - API Keys
      summary: 批量测试所有 API Key
      security:
      - BearerAuth: []
      responses:
        200:
          description: 批量测试结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        provider:
                          type: string
                        valid:
                          type: boolean
                        latency:
                          type: number
  /dialog:
    get:
      tags:
      - Dialog
      summary: 获取对话会话列表
      security:
      - BearerAuth: []
      parameters:
      - name: agentId
        in: query
        schema:
          type: string
      - name: workspaceId
        in: query
        schema:
          type: string
      responses:
        200:
          description: 会话列表
    post:
      tags:
      - Dialog
      summary: 创建新会话
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - title
              - agentId
              properties:
                title:
                  type: string
                agentId:
                  type: string
                workspaceId:
                  type: string
      responses:
        201:
          description: 创建成功
  /groups:
    get:
      tags:
      - Groups
      summary: 获取群组列表
      security:
      - BearerAuth: []
      responses:
        200:
          description: 群组列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Group'
    post:
      tags:
      - Groups
      summary: 创建群组编排
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - mode
              - agents
              properties:
                name:
                  type: string
                description:
                  type: string
                mode:
                  type: string
                  enum:
                  - sequential
                  - parallel
                  - hierarchical
                agents:
                  type: array
                  items:
                    type: string
                  description: Agent ID 列表
      responses:
        201:
          description: 创建成功
  /groups/{id}/execute:
    post:
      tags:
      - Groups
      summary: 执行群组编排
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - input
              properties:
                input:
                  type: string
                  description: 群组输入消息
      responses:
        200:
          description: 执行结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      mode:
                        type: string
                      results:
                        type: array
                        items:
                          type: object
                          properties:
                            agentId:
                              type: string
                            agentName:
                              type: string
                            response:
                              type: string
                            latency:
                              type: number
  /tasks:
    get:
      tags:
      - Tasks
      summary: 获取任务列表
      security:
      - BearerAuth: []
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - pending
          - running
          - completed
          - failed
          - cancelled
      - name: agentId
        in: query
        schema:
          type: string
      - name: workspaceId
        in: query
        schema:
          type: string
      responses:
        200:
          description: 任务列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
    post:
      tags:
      - Tasks
      summary: 创建任务
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - payload
              properties:
                name:
                  type: string
                description:
                  type: string
                priority:
                  type: string
                  enum:
                  - low
                  - normal
                  - high
                  - urgent
                  default: normal
                agentId:
                  type: string
                workspaceId:
                  type: string
                payload:
                  type: object
                scheduledAt:
                  type: string
                  format: date-time
      responses:
        201:
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Task'
  /tasks/{id}:
    get:
      tags:
      - Tasks
      summary: 获取任务详情
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        200:
          description: 任务详情
    put:
      tags:
      - Tasks
      summary: 更新任务
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                priority:
                  type: string
                status:
                  type: string
                payload:
                  type: object
      responses:
        200:
          description: 更新成功
    delete:
      tags:
      - Tasks
      summary: 删除任务
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        204:
          description: 删除成功
  /tasks/{id}/execute:
    post:
      tags:
      - Tasks
      summary: 手动执行任务
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        200:
          description: 执行结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      result:
                        type: object
                      tokens:
                        type: object
                        properties:
                          prompt:
                            type: integer
                          completion:
                            type: integer
                          total:
                            type: integer
  /knowledge:
    get:
      tags:
      - Knowledge
      summary: 获取知识库列表
      security:
      - BearerAuth: []
      responses:
        200:
          description: 知识库列表
    post:
      tags:
      - Knowledge
      summary: 创建知识库
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                description:
                  type: string
                embeddingModel:
                  type: string
                  default: openai/text-embedding-3-small
      responses:
        201:
          description: 创建成功
  /knowledge/{id}/upload:
    post:
      tags:
      - Knowledge
      summary: 上传文档到知识库
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: 支持 pdf/md/txt/docx
      responses:
        201:
          description: 上传成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      fileId:
                        type: string
                      chunks:
                        type: integer
                      status:
                        type: string
  /knowledge/{id}/search:
    post:
      tags:
      - Knowledge
      summary: 语义检索
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - query
              properties:
                query:
                  type: string
                  description: 检索查询
                topK:
                  type: integer
                  default: 5
                threshold:
                  type: number
                  default: 0.7
                  description: 相似度阈值
      responses:
        200:
          description: 检索结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        chunk:
                          type: string
                        source:
                          type: string
                        relevance:
                          type: number
                        page:
                          type: integer
  /monitor/spend:
    get:
      tags:
      - Monitoring
      summary: 获取用量统计
      security:
      - BearerAuth: []
      parameters:
      - name: period
        in: query
        schema:
          type: string
          enum:
          - day
          - week
          - month
          default: month
      - name: provider
        in: query
        schema:
          type: string
      - name: userId
        in: query
        schema:
          type: string
      responses:
        200:
          description: 用量统计
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      totalCostUSD:
                        type: number
                      totalCostCNY:
                        type: number
                      totalRequests:
                        type: integer
                      totalTokens:
                        type: object
                        properties:
                          prompt:
                            type: integer
                          completion:
                            type: integer
                          total:
                            type: integer
                      providers:
                        type: array
                        items:
                          type: object
                          properties:
                            provider:
                              type: string
                            requests:
                              type: integer
                            costUSD:
                              type: number
                            tokens:
                              type: integer
  /monitor/health:
    get:
      tags:
      - Monitoring
      - System
      summary: 系统健康检查
      responses:
        200:
          description: 系统状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  uptime:
                    type: number
                    description: 运行秒数
                  timestamp:
                    type: string
                    format: date-time
                  services:
                    type: object
                    properties:
                      database:
                        type: string
                      llm_providers:
                        type: string
                      vector_db:
                        type: string
  /health:
    get:
      tags:
      - System
      summary: 简洁健康检查（用于 Docker/K8s 探针）
      responses:
        200:
          description: 服务正常
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
  /agents/{id}/inject:
    post:
      tags:
      - Agents
      summary: POST /agents/{id}/inject
      operationId: post_agents_id_inject
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
        '400':
          description: 参数错误
        '401':
          description: 未认证
        '500':
          description: 服务器错误
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /agents/{id}/isolate:
    post:
      tags:
      - Agents
      summary: POST /agents/{id}/isolate
      operationId: post_agents_id_isolate
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
        '400':
          description: 参数错误
        '401':
