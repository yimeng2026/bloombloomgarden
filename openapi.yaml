components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum:
          - admin
          - user
          - viewer
          - agent
        avatar:
          type: string
        lastLogin:
          type: string
          format: date-time
        isAdmin:
          type: boolean
      required:
      - id
      - username
      - email
      - role
    Agent:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        role:
          type: string
        model:
          type: string
        provider:
          type: string
        systemPrompt:
          type: string
        status:
          type: string
          enum:
          - idle
          - running
          - error
          - offline
        workspaceId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - name
      - model
      - provider
      - status
    CreateAgentInput:
      type: object
      required:
      - name
      - model
      - provider
      properties:
        name:
          type: string
        description:
          type: string
        role:
          type: string
        model:
          type: string
        provider:
          type: string
          enum:
          - openai
          - azure
          - anthropic
          - deepseek
          - moonshot
          - kimi-code
          - qwen
          - gemini
          - glm
          - openrouter
          - ollama
        systemPrompt:
          type: string
        workspaceId:
          type: string
    UpdateAgentInput:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        role:
          type: string
        model:
          type: string
        provider:
          type: string
        systemPrompt:
          type: string
        status:
          type: string
        workspaceId:
          type: string
    ChatMessage:
      type: object
      properties:
        id:
          type: string
        role:
          type: string
          enum:
          - system
          - user
          - assistant
        content:
          type: string
        reasoning_content:
          type: string
        timestamp:
          type: string
          format: date-time
        model:
          type: string
        tokens:
          type: integer
    ToolCall:
      type: object
      properties:
        id:
          type: string
        tool:
          type: string
        input:
          type: object
        output:
          type: object
        status:
          type: string
          enum:
          - pending
          - running
          - success
          - error
        latency:
          type: number
    KnowledgeRef:
      type: object
      properties:
        kbId:
          type: string
        chunk:
          type: string
        source:
          type: string
        relevance:
          type: number
        page:
          type: integer
    APIKey:
      type: object
      properties:
        id:
          type: string
        provider:
          type: string
        providerName:
          type: string
        maskedKey:
          type: string
        isActive:
          type: boolean
        isValid:
          type: boolean
          nullable: true
        lastTestedAt:
          type: string
          format: date-time
          nullable: true
        latencyMs:
          type: number
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - provider
      - providerName
      - maskedKey
      - isActive
    Group:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        mode:
          type: string
          enum:
          - sequential
          - parallel
          - hierarchical
        agents:
          type: array
          items:
            type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - name
      - mode
      - agents
    Task:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
          - pending
          - running
          - completed
          - failed
          - cancelled
        priority:
          type: string
          enum:
          - low
          - normal
          - high
          - urgent
        agentId:
          type: string
        workspaceId:
          type: string
        payload:
          type: object
        result:
          type: object
        error:
          type: string
        scheduledAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - name
      - status
      - priority
      - createdAt
      - updatedAt
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 通过 /auth/login 获取的 JWT Token
