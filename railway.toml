[build]
builder = "docker"

[deploy]
startCommand = "sh start.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
healthcheckPath = "/api/health"
healthcheckTimeout = 30

[variables]
NODE_ENV = "production"
PORT = "3001"
DATABASE_URL = "file:/app/backend/data/dev.db"
UPLOAD_DIR = "/app/backend/uploads"
