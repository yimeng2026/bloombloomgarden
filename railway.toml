[build]
builder = "NIXPACKS"

[deploy]
startCommand = "cd backend && npm run build && npx prisma db push --accept-data-loss && npx prisma db seed && node dist/server.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
healthcheckPath = "/api/health"
healthcheckTimeout = 30

[nixpacks]
plan = "nodejs"
