# 研究输入草案，尚未执行；不是观测拟合结果。
# CLASS source commit: 2d88c3f650b691d2b13165e826697f43ef2530c4
# 零 CDM 时不可使用 synchronous；官方源码建议改用 newtonian。
output = tCl,pCl,lCl,mPk
gauge = newtonian

# 物质与辐射：只移除额外冷暗物质，不改动标准物质部门。
omega_b = 0.02218
omega_cdm = 0
N_ur = 3.044
N_ncdm = 0

# 平坦背景；Omega_Lambda 留空，由 CLASS 按预算闭合计算。
Omega_k = 0
Omega_fld = 0
Omega_scf = 0

# 仅用于谱形对照的冻结输入，不是独立测量结果或最佳拟合参数。
H0 = 67.66
A_s = 2.1e-9
n_s = 0.9665
tau_reio = 0.0561

# 先检查线性谱，不用非线性拟合器掩盖零模型差异。
non linear = none
